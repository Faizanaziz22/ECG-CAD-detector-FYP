name: healthcare_app
description: A healthcare application with Flutter frontend and Node.js backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.0.5
  go_router: ^10.1.2
  email_validator: ^2.1.17
  path_provider: ^2.1.5
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^16.3.2
  permission_handler: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true